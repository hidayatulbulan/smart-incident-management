<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Incident Management</title>
</head><link rel="stylesheet" href="../assets/css/style.css">
<body>

    
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="glass-card">
        
       
        <div class="left-panel">
            <div class="left-content">
                <h2>Bergabunglah Hari Ini</h2>
                <p>Buat akun Anda untuk mulai melaporkan insiden, melacak masalah, dan berkolaborasi dengan tim Anda secara efisien.</p>
            </div>
        </div>

       
        <div class="right-panel">
            <div class="logo-header">
                <h1>Membuat Akun</h1>
                <p>Smart Incident Management</p>
            </div>

            
            <div id="error" class="error-message"></div>
            <div id="success" class="success-message"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Masukkan email Anda" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                    <small class="small-text">Minimal 6 karakter</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Ulangi Kata Sandi</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Saya menerima <a href="#" style="color:#4364F7">Syarat</a> dan <a href="#" style="color:#4364F7">Kebijakan Privasi</a></label>
                </div>

                <button type="submit" class="btn-primary form-submit" id="signupBtn">
                    <span class="btn-text">Daftar</span>
                    <div class="loading-spinner" id="spinner"></div>
                </button>
            </form>

            <div class="divider"><span>Atau daftar dengan</span></div>

            <div class="social-buttons">
                <button class="btn-social" type="button" onclick="showMockMessage('Google')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)"><path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/><path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/><path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/><path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/></g></svg>
                    Google
                </button>
                <button class="btn-social" type="button" onclick="showMockMessage('Apple')">
                    <svg viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                    Apple
                </button>
            </div>

            <p class="footer-text">Sudah memiliki akun? <a href="login.html">Masuk</a></p>
        </div>
    </div>

    
   

    <script>
        const signupForm = document.getElementById('signupForm');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const spinner = document.getElementById('spinner');
        const btnText = document.querySelector('.btn-text');
        const signupBtn = document.getElementById('signupBtn');
        const API = 'http://localhost:3000/api';

        signupForm.addEventListener('submit', async (e) => {
            // CRITICAL: Prevent default form submission
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate inputs
            if (!name || !email || !password || !confirmPassword) {
                showError('All fields are required');
                return;
            }

            // Validate password strength
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            // Validate passwords match
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            // Clear previous messages
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            successDiv.style.display = 'none';
            successDiv.textContent = '';
            
            // Set loading state
            signupBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.style.display = 'none';

            try {
                // Fetch from FULL backend URL
                const response = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password })
                });

                // Handle non-OK responses
                if (!response.ok) {
                    let errorMessage = 'Registration failed';
                    
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.message || errorData.error || errorMessage;
                    } catch (jsonError) {
                        errorMessage = response.statusText || `Error ${response.status}`;
                    }
                    
                    throw new Error(errorMessage);
                }

                // Parse response JSON
                let data;
                try {
                    data = await response.json();
                } catch (jsonError) {
                    console.error('JSON parse error:', jsonError);
                    throw new Error('Invalid response format from server');
                }

                // Check success
                if (data.success) {
                    showSuccess('Account created successfully! Redirecting to login...');
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    const errorMessage = data.message || data.error || 'Registration failed';
                    showError(errorMessage);
                }

            } catch (error) {
                console.error('Signup error:', error);
                const errorMessage = error.message || 'Connection error. Please try again.';
                showError(errorMessage);

            } finally {
                // CRITICAL: Always stop loading state
                signupBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'block';
            }
        });

        /**
         * Show error message
         */
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        /**
         * Show success message
         */
        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        /**
         * Mock social signup message
         */
        function showMockMessage(provider) {
            const footer = document.querySelector('.footer-text');
            footer.innerHTML = `<span style="color:#0052D4">${provider} signup is visual only.</span>`;
            setTimeout(() => {
                footer.innerHTML = 'Already have an account? <a href="login.html">Login here</a>';
            }, 2000);
        }
    </script>
</body>
</html>
