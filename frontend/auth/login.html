<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Incident Management</title>
</head><link rel="stylesheet" href="../assets/css/style.css">
<body>

   
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

   
    <div class="glass-card">
        
        
        <div class="left-panel">
            <div class="left-content">
                <h2>Cepat, Efisien, dan Produktif</h2>
                <p>Manajemen Insiden Cerdas membantu Anda menyederhanakan pelaporan, melacak masalah secara real-time, dan menyelesaikan insiden dengan presisi.</p>
            </div>
        </div>

    
        <div class="right-panel">
            <div class="logo-header">
                <h1>Smart Incident</h1>
                <p>Selamat datang kembali! Silakan masuk.</p>
            </div>

            <div id="error" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Ingat saya</label>
                </div>

                <button type="submit" class="btn-primary form-submit" id="loginBtn">
                    <span class="btn-text">Masuk</span>
                    <div class="loading-spinner" id="spinner"></div>
                </button>
            </form>

            <div class="divider"><span>Atau lanjutkan dengan</span></div>

            <div class="social-buttons">
                <button class="btn-social" type="button" onclick="showMockMessage('Google')">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)"><path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/><path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/><path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/><path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/></g></svg>
                    Google
                </button>
                <button class="btn-social" type="button" onclick="showMockMessage('Apple')">
                    <svg viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                    Apple
                </button>
            </div>

            <p class="footer-text">Belum punya akun? <a href="signup.html">Daftar</a></p>
        </div>
    </div>

    <script>

const LOGIN_URL = 'http://localhost:3000/api/auth/login';

document.addEventListener('DOMContentLoaded', () => {
  const loginForm = document.getElementById('loginForm');
  const errorDiv = document.getElementById('error');
  const spinner = document.getElementById('spinner');
  const btnText = document.querySelector('.btn-text');
  const loginBtn = document.getElementById('loginBtn');

  if (!loginForm) {
    console.error('Login form not found');
    return;
  }

  loginForm.addEventListener('submit', handleLogin);

  async function handleLogin(e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    // Validate inputs
    if (!email || !password) {
      showError('Email and password are required');
      return;
    }

    // Clear previous errors and show loading state
    errorDiv.style.display = 'none';
    errorDiv.textContent = '';
    loginBtn.disabled = true;
    spinner.style.display = 'block';
    btnText.style.display = 'none';

    try {
      console.log('Attempting login to:', LOGIN_URL);

      // Fetch from backend
      const response = await fetch(LOGIN_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      console.log('Response status:', response.status);

      // Parse response
      let data;
      try {
        data = await response.json();
      } catch (jsonError) {
        console.error('Failed to parse JSON response:', jsonError);
        throw new Error('Invalid response format from server');
      }

      // Handle non-200 responses
      if (!response.ok) {
        const errorMessage = data.message || data.error || `Login failed (${response.status})`;
        console.error('Login error:', errorMessage);
        throw new Error(errorMessage);
      }

      // Validate response has token
      if (!data.token) {
        throw new Error(data.message || 'No token received from server');
      }

      // Save token to localStorage
      localStorage.setItem('token', data.token);
      console.log('Token saved successfully');

      // Save user info if provided
      if (data.user) {
        localStorage.setItem('user', JSON.stringify(data.user));
        console.log('User info saved to localStorage:', {
          id: data.user.id,
          name: data.user.name,
          email: data.user.email,
          role: data.user.role
        });
        console.log('Verification - Reading from localStorage:', JSON.parse(localStorage.getItem('user')));
      }

      // Determine redirect URL based on role
      let redirectUrl = '../user/dashboard.html';
      console.log('=== ROLE-BASED REDIRECT DEBUG ===');
      console.log('data.user object:', data.user);
      console.log('data.user.role:', data.user?.role);
      console.log('Role type:', typeof data.user?.role);
      
      if (data.user && data.user.role?.toLowerCase() === 'admin') {
        redirectUrl = '../admin/dashboard.html';
        console.log('Detected ADMIN role → redirecting to admin dashboard');
      } else if (data.user && data.user.role?.toLowerCase() === 'solver') {
        redirectUrl = '../solver/dashboard.html';
        console.log('Detected SOLVER role → redirecting to solver dashboard');
      } else {
        console.log('Default USER role → redirecting to user dashboard');
      }

      console.log('Final redirect URL:', redirectUrl);
      console.log('=== END DEBUG ===');
      window.location.href = redirectUrl;

    } catch (error) {
      let errorMessage = 'Login failed. Please try again.';

      if (error instanceof TypeError) {
        // Network error - fetch failed to reach server
        errorMessage = 'Failed to connect to server. Ensure http://localhost:3000 is running';
        console.error('Network error:', error.message);
        alert(errorMessage);
      } else if (error.message) {
        errorMessage = error.message;
        console.error('Login error:', errorMessage);
      }

      console.error('Full error details:', error);
      showError(errorMessage);

    } finally {
      // CRITICAL: Always stop loading state
      loginBtn.disabled = false;
      spinner.style.display = 'none';
      btnText.style.display = 'block';
    }
  }

  function showError(message) {
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
  }
});

/**
 * Mock social login message
 */
function showMockMessage(provider) {
  const footer = document.querySelector('.footer-text');
  footer.innerHTML = `<span style="color:#0052D4">${provider} login is visual only.</span>`;
  setTimeout(() => {
    footer.innerHTML = 'Don\'t have an account? <a href="signup.html">Sign up here</a>';
  }, 2000);
}
    </script>
</body>
</html>
