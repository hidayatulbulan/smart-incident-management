<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMART Incident - Insiden Saya</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg: #ffffff;
      --sidebar-width: 220px;
      --main-bg: #f4f6fb;
      --primary: #6c63ff;
      --primary-light: #ede9ff;
      --text-dark: #1a1a2e;
      --text-muted: #8a8fa8;
      --card-red: #e05b5b;
      --card-blue: #5b8def;
      --card-orange: #e0845b;
      --card-teal: #4dc4a8;
      --shadow: 0 4px 18px rgba(108,99,255,0.08);
      --radius: 16px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--main-bg);
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 28px 0 20px;
      min-height: 100vh;
      box-shadow: 2px 0 12px rgba(108,99,255,0.06);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px 28px;
      border-bottom: 1px solid #f0f0f5;
    }

    .logo-icon {
      width: 38px; height: 38px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; }

    .logo-text { line-height: 1.15; }
    .logo-text .brand { font-size: 15px; font-weight: 800; color: var(--text-dark); letter-spacing: .5px; }
    .logo-text .sub { font-size: 10px; font-weight: 600; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }

    .sidebar-nav { flex: 1; padding: 20px 0; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 22px;
      color: var(--text-muted);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      border-radius: 0;
      transition: background .2s, color .2s;
      text-decoration: none;
      position: relative;
    }

    .nav-item:hover { color: var(--primary); background: var(--primary-light); }
    .nav-item.active { color: var(--primary); background: var(--primary-light); }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-bottom {
      padding: 16px 22px 0;
      border-top: 1px solid #f0f0f5;
    }

    .logout-btn {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-muted); font-size: 13px; font-weight: 600;
      cursor: pointer; background: none; border: none;
      padding: 8px 0;
      transition: color .2s;
    }
    .logout-btn:hover { color: #e05b5b; }
    .logout-btn svg { width: 17px; height: 17px; }

    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px 0;
      background: transparent;
    }

    .topbar-greeting {
      font-size: 20px; font-weight: 800; color: var(--text-dark);
      display: flex; align-items: center; gap: 8px;
    }

    .topbar-right { display: flex; align-items: center; gap: 18px; }

    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: #ffffff;
      border: 1px solid #e8e8f0;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px; color: var(--text-muted);
      min-width: 200px;
      cursor: text;
    }
    .search-bar svg { width: 15px; height: 15px; }
    .search-bar input { flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; color: var(--text-dark); background: transparent; }
    .search-bar input::placeholder { color: var(--text-muted); }

    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f6a05b, #e05b5b);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }

    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .user-name { font-size: 14px; font-weight: 700; color: var(--text-dark); }
    .chevron { color: var(--text-muted); }

    .content {
      display: flex; gap: 24px;
      padding: 24px 32px 32px;
      flex: 1;
      flex-direction: column;
    }

    .page-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .page-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .filter-bar {
      background: #fff;
      border-radius: 10px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .filter-input,
    .filter-select {
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Nunito', sans-serif;
      color: var(--text-dark);
      background: #fff;
      cursor: pointer;
    }

    .filter-input {
      cursor: text;
      min-width: 180px;
    }

    .filter-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
    }

    .filter-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
    }

    .incidents-panel {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 14px 16px 10px;
      font-size: 12px; font-weight: 700;
      color: var(--text-muted);
      text-align: left; text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid #f0f0f5;
      background: #f9f9fb;
    }

    tbody tr { transition: background .15s; }

    tbody tr:hover { background: #f9f9fb; }

    tbody td {
      padding: 13px 16px;
      font-size: 13.5px; font-weight: 600; color: var(--text-dark);
      border-bottom: 1px solid #f7f7fb;
    }

    tbody tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }

    .badge-high   { background: #fdecea; color: #e05b5b; }
    .badge-medium { background: #fff3e0; color: #e0945b; }
    .badge-low    { background: #e8f8f1; color: #40c07a; }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-open       { background: #e3f2fd; color: #1976d2; }
    .status-progress   { background: #fff3e0; color: #f57c00; }
    .status-closed     { background: #f1f8e9; color: #689f38; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .action-btn-tangani {
      background: #5b8def;
      color: #fff;
    }

    .action-btn-tangani:hover {
      background: #4a77d4;
    }

    .action-btn-selesaikan {
      background: #4dc4a8;
      color: #fff;
    }

    .action-btn-selesaikan:hover {
      background: #3dab92;
    }

    .action-btn-detail {
      background: #6c63ff;
      color: #fff;
    }

    .action-btn-detail:hover {
      background: #5a52d5;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
      pointer-events: auto;
    }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 450px;
      padding: 0;
      overflow: hidden;
      animation: slideIn 0.3s ease;
      pointer-events: auto;
      z-index: 1001;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #f0f0f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      color: var(--text-dark);
    }

    .modal-body {
      padding: 24px;
    }

    .modal-form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .modal-form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .modal-form-group textarea {
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      color: var(--text-dark);
      resize: vertical;
      min-height: 120px;
      transition: border-color 0.2s;
      pointer-events: auto;
      cursor: text;
      user-select: text;
    }

    .modal-form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
    }

    .modal-error {
      display: none;
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      border-left: 3px solid #c33;
    }

    .modal-error.show {
      display: block;
    }

    .modal-footer {
      padding: 20px 24px;
      border-top: 1px solid #f0f0f5;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .modal-btn-cancel {
      background: #f0f0f5;
      color: var(--text-dark);
    }

    .modal-btn-cancel:hover {
      background: #e0e0e0;
    }

    .modal-btn-submit {
      background: #4dc4a8;
      color: #fff;
    }

    .modal-btn-submit:hover {
      background: #3dab92;
    }

    .modal-btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    @media(max-width:768px){
      .sidebar{width:100%;position:relative;}
      .main{margin-left:0;}
      .filter-bar{flex-direction:column;align-items:flex-start;}
      .filter-group{width:100%;}
      .filter-input{width:100%;}
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="../assets/images/logo.png" 
         style="width:36px;height:36px;object-fit:contain;border-radius:8px;" 
         alt="Logo" 
         onerror="this.style.display='none'">
    <span style="font-size:15px;font-weight:700;color:#1a1a2e;line-height:1.2;">SmartIncident</span>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
    </a>
    <a class="nav-item active" href="incidents.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Insiden
    </a>
  </nav>

  <div class="sidebar-bottom">
    <button class="logout-btn" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Log Out
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-greeting" id="greeting">Hi, ... 👋</div>
    <div class="topbar-right">
      <div class="search-bar" style="padding: 0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="topbarSearchInput" placeholder="Ketik untuk mencari" style="flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; color: var(--text-dark);" />
      </div>
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">...</span>
        <span class="chevron">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- Page Header -->
    <div class="page-header">
      <div class="page-title">Insiden</div>
      <div class="page-subtitle">Daftar semua insiden yang ditugaskan kepada Anda</div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-group" style="flex: 1;">
        <label for="searchTitleInput">Search</label>
        <input type="text" id="searchTitleInput" class="filter-input" placeholder="Cari judul atau kategori..." />
      </div>
      <div class="filter-group">
        <label for="filterStatus">Status</label>
        <select id="filterStatus" class="filter-select">
          <option value="">Semua Status</option>
          <option value="open">Open</option>
          <option value="progress">On Progress</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterPriority">Priority</label>
        <select id="filterPriority" class="filter-select">
          <option value="">Semua Priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <!-- Incidents Table -->
    <div class="incidents-panel">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Title</th>
            <th>Category</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Dilaporkan</th>
            <th>Reporter</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="incidentsTableBody">
          <tr><td colspan="8" class="empty-state">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:3000/api';

// Store all incidents for filtering
let allIncidents = [];

function getPriorityBadge(priority) {
  if (priority?.toLowerCase() === 'high') return '<span class="badge badge-high">High</span>';
  if (priority?.toLowerCase() === 'medium') return '<span class="badge badge-medium">Medium</span>';
  return '<span class="badge badge-low">Low</span>';
}

function getStatusBadge(status) {
  const badge = status?.toLowerCase() === 'open' ? 'status-open' 
              : status?.toLowerCase() === 'progress' ? 'status-progress'
              : 'status-closed';
  const label = status?.toLowerCase() === 'open' ? 'Open'
              : status?.toLowerCase() === 'progress' ? 'On Progress'
              : 'Closed';
  return `<span class="status-badge ${badge}">${label}</span>`;
}

function formatDate(dateString) {
  if (!dateString) return '-';
  const date = new Date(dateString);
  return date.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '../auth/login.html';
}

async function tanganiInsiden(id) {
  try {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '../auth/login.html'; return; }

    const response = await fetch(`${API_BASE}/solver/incidents/${id}/status`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: 'progress', solver_note: 'Sedang ditangani' })
    });

    if (!response.ok) {
      const error = await response.json();
      alert(error.message || 'Gagal mengubah status');
      return;
    }

    loadIncidents();
  } catch (err) {
    console.error('Error:', err);
    alert(err.message || 'Terjadi kesalahan');
  }
}

let currentIncidentIdForModal = null;

function openSelesaikanModal(id) {
  currentIncidentIdForModal = id;
  document.getElementById('selesaikanModalOverlay').classList.add('active');
  document.getElementById('selesaikanModalNote').value = '';
  document.getElementById('selesaikanModalError').classList.remove('show');
}

function closeSelesaikanModal() {
  document.getElementById('selesaikanModalOverlay').classList.remove('active');
  currentIncidentIdForModal = null;
}

async function submitSelesai() {
  const note = document.getElementById('selesaikanModalNote').value.trim();
  const errorEl = document.getElementById('selesaikanModalError');
  const submitBtn = document.getElementById('selesaikanModalSubmit');

  if (!note) {
    errorEl.textContent = 'Catatan penyelesaian tidak boleh kosong';
    errorEl.classList.add('show');
    return;
  }

  errorEl.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Menyimpan...';

  try {
    const token = localStorage.getItem('token');
    if (!token) { 
      window.location.href = '../auth/login.html'; 
      return; 
    }

    const response = await fetch(`${API_BASE}/solver/incidents/${currentIncidentIdForModal}/status`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: 'closed', solver_note: note })
    });

    if (!response.ok) {
      const error = await response.json();
      errorEl.textContent = error.message || 'Gagal menyelesaikan insiden';
      errorEl.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Selesaikan';
      return;
    }

    closeSelesaikanModal();
    loadIncidents();
  } catch (err) {
    console.error('Error:', err);
    errorEl.textContent = 'Terjadi kesalahan: ' + (err.message || 'Kesalahan tidak diketahui');
    errorEl.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Selesaikan';
  }
}

function filterAndRenderTable() {
  const searchTerm = document.getElementById('searchTitleInput').value.toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value.toLowerCase();
  const priorityFilter = document.getElementById('filterPriority').value.toLowerCase();

  const tbody = document.getElementById('incidentsTableBody');
  
  let filteredIncidents = allIncidents.filter(inc => {
    const titleMatch = (inc.title || '').toLowerCase().includes(searchTerm) || 
                       (inc.category || '').toLowerCase().includes(searchTerm);
    const statusMatch = !statusFilter || inc.status?.toLowerCase() === statusFilter;
    const priorityMatch = !priorityFilter || inc.priority?.toLowerCase() === priorityFilter;
    
    return titleMatch && statusMatch && priorityMatch;
  });

  if (filteredIncidents.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Belum ada insiden yang ditugaskan.</td></tr>';
    return;
  }

  tbody.innerHTML = filteredIncidents.map((inc, index) => {
    const status = inc.status?.toLowerCase() || 'open';
    const showTangani = status !== 'progress' && status !== 'closed';
    const showSelesaikan = status !== 'closed';

    return `
      <tr>
        <td>${index + 1}</td>
        <td>${inc.title || '-'}</td>
        <td>${inc.category || inc.type || '-'}</td>
        <td>${getPriorityBadge(inc.priority)}</td>
        <td>${getStatusBadge(inc.status)}</td>
        <td>${formatDate(inc.created_at)}</td>
        <td>${inc.reporter_name || '-'}</td>
        <td>
          <div class="action-buttons">
            ${showTangani ? `<button class="action-btn action-btn-tangani" onclick="tanganiInsiden(${inc.id})">Tangani</button>` : ''}
            ${showSelesaikan ? `<button class="action-btn action-btn-selesaikan" onclick="openSelesaikanModal(${inc.id})">Selesaikan</button>` : ''}
            <a href="incident-detail.html?id=${inc.id}" class="action-btn action-btn-detail">Detail</a>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

async function loadIncidents() {
  const token = localStorage.getItem('token');
  console.log('[loadIncidents] Token exists:', !!token);
  
  if (!token) { 
    console.log('[loadIncidents] No token → redirecting to login');
    window.location.href = '../auth/login.html'; 
    return; 
  }

  // Check role
  const user = JSON.parse(localStorage.getItem('user')) || {};
  console.log('[loadIncidents] User from localStorage:', user);
  console.log('[loadIncidents] User role:', user.role);
  
  if (user.role?.toLowerCase() !== 'solver') { 
    console.log('[loadIncidents] Not a solver, role is:', user.role);
    if (user.role?.toLowerCase() === 'admin') {
      window.location.href = '../admin/dashboard.html';
    } else {
      window.location.href = '../user/dashboard.html';
    }
    return; 
  }

  // Set user info
  if (user.name) {
    document.getElementById('greeting').innerHTML = `Hi, ${user.name} 👋`;
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
  }

  try {
    const response = await fetch(`${API_BASE}/solver/incidents`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (response.status === 401) { window.location.href = '../auth/login.html'; return; }
    if (!response.ok) { console.error('API error', response.status); return; }

    const data = await response.json();
    allIncidents = data.incidents || data.data || [];

    filterAndRenderTable();
  } catch (err) {
    console.error('Error loading incidents:', err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const token = localStorage.getItem('token');
  console.log('=== SOLVER INCIDENTS AUTH CHECK ===');
  console.log('Token exists:', !!token);
  
  if (!token) {
    console.log('No token found → redirecting to login');
    window.location.href = '../auth/login.html';
    return;
  }

  const userDataRaw = localStorage.getItem('user');
  console.log('User data from localStorage (raw):', userDataRaw);
  
  let user = {};
  try {
    user = JSON.parse(userDataRaw) || {};
  } catch (e) {
    console.error('Failed to parse user data:', e);
  }
  
  console.log('User object parsed:', user);
  console.log('User role:', user.role);
  console.log('Role === "solver":', user.role?.toLowerCase() === 'solver');
  
  if (user.role?.toLowerCase() !== 'solver') {
    console.log('User role is not "solver":', user.role);
    
    if (user.role?.toLowerCase() === 'admin') {
      console.log('Redirecting to admin dashboard');
      window.location.href = '../admin/dashboard.html';
    } else {
      console.log('Redirecting to user dashboard');
      window.location.href = '../user/dashboard.html';
    }
    return;
  }

  console.log('Authorization passed - loading incidents');
  console.log('=== END AUTH CHECK ===');
  
  loadIncidents();

  // Setup filter listeners
  document.getElementById('searchTitleInput').addEventListener('input', filterAndRenderTable);
  document.getElementById('filterStatus').addEventListener('change', filterAndRenderTable);
  document.getElementById('filterPriority').addEventListener('change', filterAndRenderTable);
  document.getElementById('topbarSearchInput').addEventListener('input', function() {
    document.getElementById('searchTitleInput').value = this.value;
    filterAndRenderTable();
  });
});
</script>
