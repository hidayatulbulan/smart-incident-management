<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMART Incident - Solver Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg: #ffffff;
      --sidebar-width: 220px;
      --main-bg: #f4f6fb;
      --primary: #6c63ff;
      --primary-light: #ede9ff;
      --text-dark: #1a1a2e;
      --text-muted: #8a8fa8;
      --card-red: #e05b5b;
      --card-blue: #5b8def;
      --card-orange: #e0845b;
      --card-teal: #4dc4a8;
      --shadow: 0 4px 18px rgba(108,99,255,0.08);
      --radius: 16px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--main-bg);
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 28px 0 20px;
      min-height: 100vh;
      box-shadow: 2px 0 12px rgba(108,99,255,0.06);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px 28px;
      border-bottom: 1px solid #f0f0f5;
    }

    .logo-icon {
      width: 38px; height: 38px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; }

    .logo-text { line-height: 1.15; }
    .logo-text .brand { font-size: 15px; font-weight: 800; color: var(--text-dark); letter-spacing: .5px; }
    .logo-text .sub { font-size: 10px; font-weight: 600; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }

    .sidebar-nav { flex: 1; padding: 20px 0; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 22px;
      color: var(--text-muted);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      border-radius: 0;
      transition: background .2s, color .2s;
      text-decoration: none;
      position: relative;
    }

    .nav-item:hover { color: var(--primary); background: var(--primary-light); }
    .nav-item.active { color: var(--primary); background: var(--primary-light); }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-bottom {
      padding: 16px 22px 0;
      border-top: 1px solid #f0f0f5;
    }

    .logout-btn {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-muted); font-size: 13px; font-weight: 600;
      cursor: pointer; background: none; border: none;
      padding: 8px 0;
      transition: color .2s;
    }
    .logout-btn:hover { color: #e05b5b; }
    .logout-btn svg { width: 17px; height: 17px; }

    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px 0;
      background: transparent;
    }

    .topbar-greeting {
      font-size: 20px; font-weight: 800; color: var(--text-dark);
      display: flex; align-items: center; gap: 8px;
    }

    .topbar-right { display: flex; align-items: center; gap: 18px; }

    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: #ffffff;
      border: 1px solid #e8e8f0;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px; color: var(--text-muted);
      min-width: 200px;
      cursor: text;
    }
    .search-bar svg { width: 15px; height: 15px; }
    .search-bar input { flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; color: var(--text-dark); background: transparent; }
    .search-bar input::placeholder { color: var(--text-muted); }

    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f6a05b, #e05b5b);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }

    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .user-name { font-size: 14px; font-weight: 700; color: var(--text-dark); }
    .chevron { color: var(--text-muted); }

    .content {
      display: flex; gap: 24px;
      padding: 24px 32px 32px;
      flex: 1;
      flex-direction: column;
    }

    .content-left { flex: 1; display: flex; flex-direction: column; gap: 24px; }

    .stat-cards { display: flex; gap: 16px; }

    .stat-card {
      flex: 1; border-radius: var(--radius);
      padding: 20px 22px;
      position: relative; overflow: hidden;
      min-height: 110px;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    }

    .stat-card::before, .stat-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: .25;
    }

    .stat-card.red   { background: linear-gradient(135deg, #e05b5b, #e87c7c); }
    .stat-card.blue  { background: linear-gradient(135deg, #5b8def, #7aaef5); }
    .stat-card.orange{ background: linear-gradient(135deg, #e0845b, #e8a07c); }
    .stat-card.teal  { background: linear-gradient(135deg, #4dc4a8, #70d4bc); }

    .stat-card.red::before   { background: #ff8f8f; width: 90px; height: 90px; top: -20px; right: 10px; }
    .stat-card.red::after    { background: #c94444; width: 55px; height: 55px; top: 30px; right: -10px; }
    .stat-card.blue::before  { background: #7ab2ff; width: 80px; height: 80px; top: -15px; right: 20px; }
    .stat-card.blue::after   { background: #3d72d6; width: 45px; height: 45px; bottom: -5px; right: 15px; }
    .stat-card.orange::before{ background: #f0a880; width: 85px; height: 85px; top: -18px; right: 10px; }
    .stat-card.orange::after { background: #c86a3a; width: 50px; height: 50px; bottom: -8px; right: 20px; }
    .stat-card.teal::before  { background: #70e0c8; width: 80px; height: 80px; top: -18px; right: 15px; }
    .stat-card.teal::after   { background: #30a88a; width: 50px; height: 50px; top: 30px; right: -8px; }

    .stat-label {
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85);
      text-transform: uppercase; letter-spacing: .5px;
      display: flex; align-items: center; gap: 6px;
    }
    .stat-label svg { width: 15px; height: 15px; }

    .stat-val {
      font-size: 32px; font-weight: 800; color: #fff;
      display: flex; align-items: center; gap: 8px;
      position: relative; z-index: 1;
    }
    .stat-val svg { width: 20px; height: 20px; }

    .incidents-panel {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 20px 24px 0;
      font-size: 16px; font-weight: 800; color: var(--text-dark);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 14px 20px 10px;
      font-size: 12px; font-weight: 700;
      color: var(--text-muted);
      text-align: left; text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid #f0f0f5;
    }

    tbody tr { transition: background .15s; }

    tbody td {
      padding: 13px 20px;
      font-size: 13.5px; font-weight: 600; color: var(--text-dark);
      border-bottom: 1px solid #f7f7fb;
    }

    tbody tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }

    .badge-high   { background: #fdecea; color: #e05b5b; }
    .badge-medium { background: #fff3e0; color: #e0945b; }
    .badge-low    { background: #e8f8f1; color: #40c07a; }

    .status-open       { color: #5b8def; font-weight: 700; }
    .status-inprogress { color: #ed8c41; font-weight: 700; }
    .status-closed     { color: #5fc343; font-weight: 700; }

    .view-all-wrap {
      display: flex; justify-content: center;
      padding: 16px;
      border-top: 1px solid #f0f0f5;
    }

    .view-all-btn {
      background: none; border: none;
      color: var(--primary); font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      padding: 6px 18px;
      border-radius: 8px;
      transition: background .2s;
    }
    .view-all-btn:hover { background: var(--primary-light); }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
      pointer-events: auto;
    }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 450px;
      padding: 0;
      overflow: hidden;
      animation: slideIn 0.3s ease;
      pointer-events: auto;
      z-index: 1001;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #f0f0f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      color: var(--text-dark);
    }

    .modal-body {
      padding: 24px;
    }

    .modal-form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .modal-form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .modal-form-group textarea {
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      color: var(--text-dark);
      resize: vertical;
      min-height: 120px;
      transition: border-color 0.2s;
      pointer-events: auto;
      cursor: text;
      user-select: text;
    }

    .modal-form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
    }

    .modal-error {
      display: none;
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      border-left: 3px solid #c33;
    }

    .modal-error.show {
      display: block;
    }

    .modal-footer {
      padding: 20px 24px;
      border-top: 1px solid #f0f0f5;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .modal-btn-cancel {
      background: #f0f0f5;
      color: var(--text-dark);
    }

    .modal-btn-cancel:hover {
      background: #e0e0e0;
    }

    .modal-btn-submit {
      background: #4dc4a8;
      color: #fff;
    }

    .modal-btn-submit:hover {
      background: #3dab92;
    }

    .modal-btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    @media(max-width:768px){
      .sidebar{width:100%;position:relative;}
      .main{margin-left:0;}
      .stat-cards{flex-direction:column;}
    }
  </style>
</head>

<!-- MAIN -->
<div class="main">
  <div class="topbar">

    <div class="topbar-right">
      <div class="search-bar" style="padding: 0;">

<script>
const API_BASE = 'http://localhost:3000/api';

function getStatusBadge(status) {
  const map = {
    open:     { label: 'Open',        bg: '#e3f2fd', color: '#1976d2' },
    progress: { label: 'On Progress', bg: '#fff3e0', color: '#f57c00' },
    closed:   { label: 'Closed',      bg: '#f1f8e9', color: '#689f38' }
  };
  const s = map[status?.toLowerCase()] || { label: status, bg: '#f0f0f0', color: '#666' };
  return `<span style="background:${s.bg};color:${s.color};padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">${s.label}</span>`;
}

function getPriorityBadge(priority) {
  if (priority?.toLowerCase() === 'high') return '<span class="badge badge-high">High</span>';
  if (priority?.toLowerCase() === 'medium') return '<span class="badge badge-medium">Medium</span>';
  return '<span class="badge badge-low">Low</span>';
}

function formatDate(dateString) {
  if (!dateString) return '-';
  const date = new Date(dateString);
  return date.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '../auth/login.html';
}

async function tanganiInsiden(id) {
  try {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '../auth/login.html'; return; }

    const response = await fetch(`${API_BASE}/solver/incidents/${id}/status`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: 'progress', solver_note: 'Sedang ditangani' })
    });

    if (!response.ok) {
      const error = await response.json();
      alert(error.message || 'Gagal mengubah status');
      return;
    }

    alert('Status diperbarui!');
    loadDashboard();
  } catch (err) {
    console.error('Error:', err);
    alert(err.message || 'Terjadi kesalahan');
  }
}

let currentIncidentIdForModal = null;

function openSelesaikanModal(id) {
  currentIncidentIdForModal = id;
  document.getElementById('selesaikanModalOverlay').classList.add('active');
  document.getElementById('selesaikanModalNote').value = '';
  document.getElementById('selesaikanModalError').classList.remove('show');
}

function closeSelesaikanModal() {
  document.getElementById('selesaikanModalOverlay').classList.remove('active');
  currentIncidentIdForModal = null;
}

async function submitSelesai() {
  const note = document.getElementById('selesaikanModalNote').value.trim();
  const errorEl = document.getElementById('selesaikanModalError');
  const submitBtn = document.getElementById('selesaikanModalSubmit');

  // Validate input
  if (!note) {
    errorEl.textContent = 'Catatan penyelesaian tidak boleh kosong';
    errorEl.classList.add('show');
    return;
  }

  // Hide error
  errorEl.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Menyimpan...';

  try {
    const token = localStorage.getItem('token');
    if (!token) { 
      window.location.href = '../auth/login.html'; 
      return; 
    }

    const response = await fetch(`${API_BASE}/solver/incidents/${currentIncidentIdForModal}/status`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ status: 'closed', solver_note: note })
    });

    if (!response.ok) {
      const error = await response.json();
      errorEl.textContent = error.message || 'Gagal menyelesaikan insiden';
      errorEl.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Selesaikan';
      return;
    }

    // Success
    closeSelesaikanModal();
    loadDashboard();
  } catch (err) {
    console.error('Error:', err);
    errorEl.textContent = 'Terjadi kesalahan: ' + (err.message || 'Kesalahan tidak diketahui');
    errorEl.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Selesaikan';
  }
}

async function selesaikanInsiden(id) {
  openSelesaikanModal(id);
}

function filterIncidentsTable(searchTerm) {
  const rows = document.querySelectorAll('#incidentsTableBody tr');
  rows.forEach(row => {
    const emptyState = row.querySelector('.empty-state');
    if (emptyState) return;
    const titleCell = row.cells[0]?.textContent.toLowerCase() || '';
    const categoryCell = row.cells[1]?.textContent.toLowerCase() || '';
    const matches = titleCell.includes(searchTerm) || categoryCell.includes(searchTerm);
    row.style.display = matches ? '' : 'none';
  });
}

async function loadDashboard() {
  const token = localStorage.getItem('token');
  console.log('[loadDashboard] Token exists:', !!token);
  
  if (!token) { 
    console.log('[loadDashboard] No token → redirecting to login');
    window.location.href = '../auth/login.html'; 
    return; 
  }

  // Check role
  const user = JSON.parse(localStorage.getItem('user')) || {};
  console.log('[loadDashboard] User from localStorage:', user);
  console.log('[loadDashboard] User role:', user.role);
  
  if (user.role?.toLowerCase() !== 'solver') { 
    console.log('[loadDashboard] Not a solver, role is:', user.role);
    // Redirect to correct dashboard
    if (user.role?.toLowerCase() === 'admin') {
      window.location.href = '../admin/dashboard.html';
    } else {
      window.location.href = '../user/dashboard.html';
    }
    return; 
  }

  // Set user info
  if (user.name) {
    document.getElementById('greeting').innerHTML = `Hi, ${user.name} 👋`;
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
  }

  try {
    const response = await fetch(`${API_BASE}/solver/incidents`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (response.status === 401) { window.location.href = '../auth/login.html'; return; }
    if (!response.ok) { console.error('API error', response.status); return; }

    const data = await response.json();
    const incidents = data.incidents || data.data || [];

    // Stats
    const total = incidents.length;
    const pending = incidents.filter(i => i.status?.toLowerCase() === 'open').length;
    const inProgress = incidents.filter(i => i.status?.toLowerCase() === 'progress').length;
    const closed = incidents.filter(i => i.status?.toLowerCase() === 'closed').length;

    document.getElementById('totalAssigned').textContent = total;
    document.getElementById('pending').textContent = pending;
    document.getElementById('onProgress').textContent = inProgress;
    document.getElementById('selesai').textContent = closed;

    // Table
    const tbody = document.getElementById('incidentsTableBody');
    if (incidents.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Belum ada insiden yang ditugaskan.</td></tr>';
    } else {
      tbody.innerHTML = incidents.map(inc => {
        const status = inc.status?.toLowerCase() || 'open';
        const showTangani = status !== 'progress' && status !== 'closed';
        const showSelesaikan = status !== 'closed';
        
        return `
          <tr>
            <td>${inc.title || '-'}</td>
            <td>${inc.category || inc.type || '-'}</td>
            <td>${getPriorityBadge(inc.priority)}</td>
            <td>${getStatusBadge(inc.status)}</td>
            <td>${formatDate(inc.created_at)}</td>
            <td>
              ${showTangani ? `<button onclick="tanganiInsiden(${inc.id})" style="background:#5b8def;color:#fff;border:none;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-right:4px;">Tangani</button>` : ''}
              ${showSelesaikan ? `<button onclick="openSelesaikanModal(${inc.id})" style="background:#4dc4a8;color:#fff;border:none;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">Selesaikan</button>` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    // Setup search bar
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        filterIncidentsTable(this.value.toLowerCase());
      });
    }

  } catch (err) {
    console.error('Error loading dashboard:', err);
  }
}

// Notification functions (global scope for onclick handlers)
async function loadNotifications() {
  const token = localStorage.getItem('token');
  if (!token) return;
  try {
    const res = await fetch('http://localhost:3000/api/notifications', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    const notifs = data.notifications || [];
    const unread = notifs.filter(n => !n.is_read).length;
    const badge = document.getElementById('notifBadge');
    if (badge) {
      badge.textContent = unread;
      badge.style.display = unread > 0 ? 'flex' : 'none';
    }
    const list = document.getElementById('notifList');
    if (!list) return;
    if (notifs.length === 0) {
      list.innerHTML = '<div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px;">Tidak ada notifikasi</div>';
      return;
    }
    list.innerHTML = notifs.map(n => `
      <div onclick="markRead(${n.id})" style="
        padding:14px 18px;border-bottom:1px solid #f9f9fc;
        background:${n.is_read ? '#fff' : '#f5f3ff'};cursor:pointer;
      ">
        <div style="font-size:13px;font-weight:700;color:#1a1a2e;margin-bottom:3px;">${n.title}</div>
        <div style="font-size:12px;color:#6b7280;">${n.message}</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:4px;">${new Date(n.created_at).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

function toggleNotifications() {
  const dd = document.getElementById('notifDropdown');
  if (!dd) return;
  if (dd.style.display === 'block') {
    dd.style.display = 'none';
  } else {
    dd.style.display = 'block';
    loadNotifications();
  }
}

async function markRead(id) {
  const token = localStorage.getItem('token');
  await fetch(`http://localhost:3000/api/notifications/${id}/read`, {
    method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
  });
  loadNotifications();
}

async function markAllRead() {
  const token = localStorage.getItem('token');
  await fetch('http://localhost:3000/api/notifications/read-all', {
    method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
  });
  loadNotifications();
}

document.addEventListener('DOMContentLoaded', () => {
  const token = localStorage.getItem('token');
  console.log('=== SOLVER DASHBOARD AUTH CHECK ===');
  console.log('Token exists:', !!token);
  
  if (!token) {
    console.log('No token found → redirecting to login');
    window.location.href = '../auth/login.html';
    return;
  }

  const userDataRaw = localStorage.getItem('user');
  console.log('User data from localStorage (raw):', userDataRaw);
  
  let user = {};
  try {
    user = JSON.parse(userDataRaw) || {};
  } catch (e) {
    console.error('Failed to parse user data:', e);
  }
  
  console.log('User object parsed:', user);
  console.log('User role:', user.role);
  console.log('Role type:', typeof user.role);
  console.log('Role === "solver":', user.role?.toLowerCase() === 'solver');
  
  if (user.role?.toLowerCase() !== 'solver') {
    console.log('User role is not "solver":', user.role);
    console.log('Redirecting based on actual role...');
    
    // Redirect to correct dashboard based on role
    if (user.role?.toLowerCase() === 'admin') {
      console.log('Redirecting to admin dashboard');
      window.location.href = '../admin/dashboard.html';
    } else {
      console.log('Redirecting to user dashboard');
      window.location.href = '../user/dashboard.html';
    }
    return;
  }

  console.log('Authorization passed - loading dashboard');
  console.log('=== END AUTH CHECK ===');

  loadNotifications();
  setInterval(loadNotifications, 30000);

  document.addEventListener('click', (e) => {
    const dd = document.getElementById('notifDropdown');
    if (dd && !dd.contains(e.target) && !e.target.closest('[onclick="toggleNotifications()"]')) {
      dd.style.display = 'none';
    }
  });

  loadDashboard();
});
</script>
