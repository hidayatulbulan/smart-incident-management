<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Data - Smart Incident</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

            transform: translateY(-50%);

        .incidents-table td {
            padding: 18px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;

        .priority-badge {

            background: #e0f7fa;

        }

        .priority-low {

        }

        .status-badge {
            padding: 4px 12px;

            font-size: 11px;

        .status-open {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-progress {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-closed {
            background: #f1f8e9;
            color: #689f38;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .edit-btn {
            background: #e3f2fd;
            color: #1976d2;
        }

        .edit-btn:hover {
            background: #1976d2;
            color: white;
        }

        .delete-btn {
            background: #ffebee;
            color: #c62828;
        }

        .delete-btn:hover {
            background: #c62828;
            color: white;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }

        .page-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            background: white;
            cursor: pointer;
            font-size: 13px;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-btn:hover:not(.active) {
            background: #f5f7fa;
        }
    </style>

<script>
/**
 * Admin Incidents List Handler
 * Fetches and displays all incident reports for admin users
 */

/**
 * Format date from ISO format to DD-MM-YYYY
 * @param {string} dateString - ISO date string
 * @returns {string} Formatted date string
 */
function formatDateDDMMYYYY(dateString) {
    try {
        const date = new Date(dateString);
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}-${month}-${year}`;
    } catch (error) {
        console.error('Error formatting date:', error);
        return dateString;
    }
}

/**
 * Get first letter of a name for avatar
 * @param {string} name - Full name
 * @returns {string} First letter in uppercase
 */
function getAvatarInitial(name) {
    return name ? name.charAt(0).toUpperCase() : '?';
}

/**
 * Generate a color based on a string (deterministic)
 * @param {string} str - Input string
 * @returns {string} Hex color code
 */
function getColorFromString(str) {
    const colors = [
        '#ffd89b', // Orange
        '#a8edea', // Cyan
        '#f093fb', // Pink
        '#667eea', // Purple
        '#4facfe', // Blue
        '#43e97b', // Green
        '#fa709a', // Red-pink
        '#fee140', // Yellow
    ];
    
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    
    const index = Math.abs(hash) % colors.length;
    return colors[index];
}

/**
 * Show error message to user
 * @param {string} message - Error message to display
 */
function showError(message) {
    const alertDiv = document.createElement('div');
    alertDiv.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: #ef4444;
        color: white;
        padding: 16px 24px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        z-index: 1000;
        max-width: 400px;
        font-weight: 600;
    `;
    alertDiv.textContent = message;
    document.body.appendChild(alertDiv);

    setTimeout(() => {
        alertDiv.remove();
    }, 4000);
}

/**
 * Show success message to user
 * @param {string} message - Success message to display
 */
function showSuccess(message) {
    const alertDiv = document.createElement('div');
    alertDiv.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: #22c55e;
        color: white;
        padding: 16px 24px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
        z-index: 1000;
        max-width: 400px;
        font-weight: 600;
    `;
    alertDiv.textContent = message;
    document.body.appendChild(alertDiv);

    setTimeout(() => {
        alertDiv.remove();
    }, 3000);
}

/**
 * Show loading message
 */
function showLoading() {
    const tbody = document.querySelector('.incidents-table tbody');
    if (tbody) {
        tbody.innerHTML = `
            <tr>
                <td colspan="9" style="text-align: center; padding: 40px;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #667eea;"></i>
                    <p style="margin-top: 10px; color: #999;">Memuat data insiden...</p>
                </td>
            </tr>
        `;
    }
}

/**
 * Show empty state message
 */
function showEmptyState() {
    const tbody = document.querySelector('.incidents-table tbody');
    if (tbody) {
        tbody.innerHTML = `
            <tr>
                <td colspan="9" style="text-align: center; padding: 40px;">
                    <i class="fas fa-inbox" style="font-size: 40px; color: #ddd; margin-bottom: 10px;"></i>
                    <p style="color: #999; font-size: 14px;">Belum ada laporan insiden</p>
                </td>
            </tr>
        `;
    }
}

/**
 * Render incidents into the table
 * @param {Array} incidents - Array of incident objects
 */
async function renderIncidents(incidents) {
    const tbody = document.querySelector('.incidents-table tbody');
    
    if (!tbody) {
        console.error('Table body not found');
        return;
    }

    // Store incidents for modal access
    allIncidentsData = incidents;

    // Fetch solvers list for dropdown
    let solvers = [];
    try {
        const token = localStorage.getItem('token');
        const response = await fetch('http://localhost:3000/api/admin/solvers', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        if (response.ok) {
            const data = await response.json();
            solvers = data.data || [];
        }
    } catch (error) {
        console.error('Error fetching solvers:', error);
    }

    // Clear existing rows
    tbody.innerHTML = '';

    // Check if incidents array is empty
    if (!incidents || incidents.length === 0) {
        showEmptyState();
        return;
    }

    // Render each incident
    incidents.forEach((incident, index) => {
        const row = document.createElement('tr');
        
        // Get reporter name
        const reporterName = incident.reporter_name || 'Unknown';
        const userInitial = getAvatarInitial(reporterName);
        const avatarColor = getColorFromString(incident.id?.toString() || '');
        
        // Format date
        const formattedDate = formatDateDDMMYYYY(incident.created_at);
        
        // Get assigned solver name
        const assignedSolver = solvers.find(s => s.id === incident.assigned_to);
        const assignedSolverName = assignedSolver ? assignedSolver.name : null;
        
        // Enrich incident data for modal access
        const enrichedIncident = {
            ...incident,
            assigned_solver_name: assignedSolverName
        };
        
        // Store in allIncidentsData
        const existingIndex = allIncidentsData.findIndex(inc => inc.id === incident.id);
        if (existingIndex >= 0) {
            allIncidentsData[existingIndex] = enrichedIncident;
        } else {
            allIncidentsData.push(enrichedIncident);
        }
        
        // Determine status badge class
        let statusClass = 'status-open';
        if (incident.status?.toLowerCase() === 'progress') statusClass = 'status-progress';
        else if (incident.status?.toLowerCase() === 'closed') statusClass = 'status-closed';
        
        // Determine priority badge class dynamically
        const priorityClass = 'priority-' + (incident.priority || 'medium').toLowerCase();
        
        // Build solver dropdown options
        let solverOptions = '<option value="">-- Pilih Solver --</option>';
        solvers.forEach(solver => {
            const selected = incident.assigned_to === solver.id ? 'selected' : '';
            solverOptions += `<option value="${solver.id}" ${selected}>${escapeHtml(solver.name)}</option>`;
        });
        
        // Build row HTML
        row.innerHTML = `
            <td>#${String(incident.id).padStart(3, '0')}</td>
            <td>
                <div class="user-cell">
                    <div class="user-avatar-small" style="background: ${avatarColor};">${userInitial}</div>
                    <span>${escapeHtml(reporterName)}</span>
                </div>
            </td>
            <td>${escapeHtml(incident.title || '-')}</td>
            <td>${escapeHtml(incident.category || '-')}</td>
            <td><span class="priority-badge ${priorityClass}">${escapeHtml(incident.priority || 'Medium')}</span></td>
            <td>
                <select class="status-select ${statusClass}" onchange="updateStatus(${incident.id}, this.value)">
                    <option value="open" ${incident.status?.toLowerCase() === 'open' ? 'selected' : ''}>Open</option>
                    <option value="progress" ${incident.status?.toLowerCase() === 'progress' ? 'selected' : ''}>On Progress</option>
                    <option value="closed" ${incident.status?.toLowerCase() === 'closed' ? 'selected' : ''}>Closed</option>
                </select>
            </td>
            <td>
                <select class="filter-select" onchange="assignSolver(${incident.id}, this.value)" style="padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; cursor: pointer;">
                    ${solverOptions}
                </select>
            </td>
            <td>${formattedDate}</td>
            <td>
                <div class="action-buttons">
                    <button class="action-btn edit-btn" title="View incident" onclick="viewIncident(${incident.id})">
                        <i class="fas fa-eye"></i>
                    </button>
                    <button class="action-btn edit-btn" title="Edit incident" onclick="editIncident(${incident.id})">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="action-btn delete-btn" title="Delete incident" onclick="deleteIncident(${incident.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
}

/**
 * Escape HTML to prevent XSS
 * @param {string} text - Text to escape
 * @returns {string} Escaped text
 */
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

/**
 * Store incidents for modal access
 */
let allIncidentsData = [];

/**
 * Get incident by ID from allIncidentsData
 */
function getIncidentById(id) {
    return allIncidentsData.find(inc => inc.id === parseInt(id));
}

/**
 * Open incident detail modal
 */
function openIncidentModal(id, isReadOnly = false) {
    const incident = getIncidentById(id);
    if (!incident) {
        showError('Incident not found');
        return;
    }

    const modal = document.getElementById('incidentModal');
    if (!modal) {
        createIncidentModal();
    }

    const modalContent = document.getElementById('incidentModalContent');
    const statusSelect = document.getElementById('modalStatusSelect');
    const adminNotetextarea = document.getElementById('modalAdminNote');
    const saveBtn = document.getElementById('modalSaveBtn');
    const formFields = document.querySelectorAll('.modal-form-group input:not([type="hidden"]), .modal-form-group textarea');

    // Set all fields
    document.getElementById('modalIncidentId').value = incident.id;
    document.getElementById('modalTitle').value = incident.title || '';
    document.getElementById('modalCategory').value = incident.category || '';
    document.getElementById('modalLocation').value = incident.location || '';
    document.getElementById('modalDescription').value = incident.description || '';
    document.getElementById('modalPriority').value = incident.priority || '';
    statusSelect.value = incident.status?.toLowerCase() || 'open';
    adminNotetextarea.value = incident.admin_note || '';
    document.getElementById('modalAssignedSolver').value = incident.assigned_solver_name || 'Belum di-assign';
    const solverNoteField = document.getElementById('modalSolverNote');
    if (solverNoteField) {
        solverNoteField.value = incident.solver_note || 'Belum ada catatan dari solver';
    }

    // Set photo
    const photoImg = document.getElementById('modalPhoto');
    if (incident.photo) {
        photoImg.src = `http://localhost:3000/uploads/incidents/${incident.photo}`;
        photoImg.style.display = 'block';
    } else {
        photoImg.style.display = 'none';
    }

    const noPhotoText = document.getElementById('modalNoPhoto');
    if (!incident.photo) {
        noPhotoText.style.display = 'block';
    } else {
        noPhotoText.style.display = 'none';
    }

    // Handle read-only mode
    if (isReadOnly) {
        document.getElementById('modalTitle').textContent = `Incident #${incident.id}`;
        formFields.forEach(field => field.disabled = true);
        statusSelect.disabled = true;
        adminNotetextarea.disabled = true;
        saveBtn.style.display = 'none';
        document.querySelector('.modal-header h2').textContent = 'View Incident';
    } else {
        document.querySelector('.modal-header h2').textContent = 'Edit Incident';
        formFields.forEach(field => field.disabled = false);
        statusSelect.disabled = false;
        adminNotetextarea.disabled = false;
        saveBtn.style.display = 'block';
    }

    // Show modal
    document.getElementById('incidentModal').style.display = 'flex';
}

/**
 * Create incident detail modal
 */
function createIncidentModal() {
    if (document.getElementById('incidentModal')) return;

    const modal = document.createElement('div');
    modal.id = 'incidentModal';
    modal.style.cssText = `
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding: 20px;
    `;

    modal.innerHTML = `
        <div class="modal-box" style="
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        ">
            <div class="modal-header" style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px;
                border-bottom: 1px solid #e5e7eb;
                position: sticky;
                top: 0;
                background: white;
            ">
                <h2 style="font-size: 18px; font-weight: 700; color: #1a1a2e;">Edit Incident</h2>
                <button onclick="closeIncidentModal()" style="
                    background: none;
                    border: none;
                    font-size: 24px;
                    color: #9ca3af;
                    cursor: pointer;
                    width: 32px;
                    height: 32px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="modal-body" style="padding: 20px;">

/**
 * Close incident modal
 */
function closeIncidentModal() {
    const modal = document.getElementById('incidentModal');
    if (modal) {
        modal.style.display = 'none';
    }
}

/**
 * Save incident changes
 */
async function saveIncidentChanges() {
    const incidentId = document.getElementById('modalIncidentId').value;
    const status = document.getElementById('modalStatusSelect').value;
    const adminNote = document.getElementById('modalAdminNote').value;
    const token = localStorage.getItem('token');

    try {
        const response = await fetch(`http://localhost:3000/api/admin/incidents/${incidentId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ status, admin_note: adminNote })
        });

        const responseData = await response.json();
        if (!response.ok) throw new Error(responseData.message || 'Failed to update incident');

        showSuccess(`Incident #${incidentId} updated successfully`);
        closeIncidentModal();
        fetchIncidents();
    } catch (error) {
        showError('Error saving incident: ' + error.message);
    }
}

/**
 * Edit incident - opens modal
 */
function editIncident(id) {
    openIncidentModal(id, false);
}

/**
 * View incident - opens read-only modal
 */
function viewIncident(id) {
    openIncidentModal(id, true);
}

/**
 * Delete incident
 */
function deleteIncident(id) {
    if (confirm(`Are you sure you want to delete incident #${id}?`)) {
        alert(`Delete incident #${id} functionality coming soon`);
    }
}

/**
 * Update incident status
 * @param {number} id - Incident ID
 * @param {string} newStatus - New status value
 */
async function updateStatus(id, newStatus) {
    const token = localStorage.getItem('token');
    try {
        const response = await fetch(`http://localhost:3000/api/admin/incidents/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ status: newStatus })
        });
        const responseData = await response.json();
        if (!response.ok) throw new Error(responseData.message || 'Gagal update status');
        showSuccess(`Status incident #${id} berhasil diubah`);
        fetchIncidents();
    } catch (error) {
        showError('Gagal mengubah status incident: ' + error.message);
    }
}

/**
 * Assign incident to solver
 * @param {number} incidentId - Incident ID
 * @param {string} solverId - Solver user ID to assign to
 */
async function assignSolver(incidentId, solverId) {
    // If no solver selected, return
    if (!solverId) {
        return;
    }

    const token = localStorage.getItem('token');
    try {
        const response = await fetch(`http://localhost:3000/api/admin/incidents/${incidentId}/assign`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ assigned_to: parseInt(solverId) })
        });

        const responseData = await response.json();
        if (!response.ok) throw new Error(responseData.message || 'Gagal assign solver');

        showSuccess('Solver berhasil di-assign!');
        fetchIncidents();
    } catch (error) {
        showError('Gagal assign solver: ' + error.message);
    }
}

/**
 * Fetch all incidents from API
 */
async function fetchIncidents() {
    // Check if token exists
    const token = localStorage.getItem('token');
    
    if (!token) {
        alert('Anda harus login terlebih dahulu');
        window.location.href = '../auth/login.html';
        return;
    }

    try {
        showLoading();

        // Fetch incidents from API
        const response = await fetch('http://localhost:3000/api/admin/incidents', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });

        // Handle response status
        if (response.status === 401) {
            alert('Unauthorized');
            window.location.href = '../auth/login.html';
            return;
        }

        if (response.status === 403) {
            showError('Access denied');
            return;
        }

        if (response.status === 500) {
            showError('Gagal memuat data insiden');
            return;
        }

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        // Parse JSON response
        const data = await response.json();

        // Check if response is successful
        if (data.success && Array.isArray(data.data)) {
            renderIncidents(data.data);
        } else {
            showEmptyState();
        }
    } catch (error) {
        console.error('Error fetching incidents:', error);
        showError('Gagal memuat data insiden');
        showEmptyState();
    }
}

/**
 * Initialize page on load
 */
document.addEventListener('DOMContentLoaded', function() {
    // Load incidents on page load
    fetchIncidents();

    // Setup logout functionality
    const logoutBtn = document.querySelector('.logout');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../auth/login.html';
        });
    }
});
