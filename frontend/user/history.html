<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMART Incident - Riwayat Laporan</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg: #ffffff;
      --sidebar-width: 220px;
      --main-bg: #f4f6fb;
      --primary: #6c63ff;
      --primary-light: #ede9ff;
      --text-dark: #1a1a2e;
      --text-muted: #8a8fa8;
      --card-red: #e05b5b;
      --card-blue: #5b8def;
      --card-orange: #e0845b;
      --card-teal: #4dc4a8;
      --shadow: 0 4px 18px rgba(108,99,255,0.08);
      --radius: 16px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--main-bg);
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 28px 0 20px;
      min-height: 100vh;
      box-shadow: 2px 0 12px rgba(108,99,255,0.06);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px 28px;
      border-bottom: 1px solid #f0f0f5;
    }

    .logo-icon {
      width: 38px; height: 38px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; }

    .logo-text { line-height: 1.15; }
    .logo-text .brand { font-size: 15px; font-weight: 800; color: var(--text-dark); letter-spacing: .5px; }
    .logo-text .sub { font-size: 10px; font-weight: 600; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }

    .sidebar-nav { flex: 1; padding: 20px 0; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 22px;
      color: var(--text-muted);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      border-radius: 0;
      transition: background .2s, color .2s;
      text-decoration: none;
      position: relative;
    }

    .nav-item:hover { color: var(--primary); background: var(--primary-light); }
    .nav-item.active { color: var(--primary); background: var(--primary-light); }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-bottom {
      padding: 16px 22px 0;
      border-top: 1px solid #f0f0f5;
    }

    .logout-btn {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-muted); font-size: 13px; font-weight: 600;
      cursor: pointer; background: none; border: none;
      padding: 8px 0;
      transition: color .2s;
    }
    .logout-btn:hover { color: #e05b5b; }
    .logout-btn svg { width: 17px; height: 17px; }

    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px 0;
      background: transparent;
    }

    .topbar-left {
      flex: 1;
    }

    .topbar-title {
      font-size: 20px; font-weight: 800; color: var(--text-dark);
    }

    .topbar-subtitle {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      margin-top: 2px;
    }

    .topbar-right { display: flex; align-items: center; gap: 18px; }

    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: #ffffff;
      border: 1px solid #e8e8f0;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px; color: var(--text-muted);
      min-width: 200px;
      cursor: text;
    }
    .search-bar svg { width: 15px; height: 15px; }
    .search-bar input { flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; color: var(--text-dark); background: transparent; }
    .search-bar input::placeholder { color: var(--text-muted); }

    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f6a05b, #e05b5b);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }

    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .user-name { font-size: 14px; font-weight: 700; color: var(--text-dark); }
    .chevron { color: var(--text-muted); }

    .content {
      display: flex;
      padding: 24px 32px 32px;
      flex: 1;
      flex-direction: column;
    }

    .filter-bar {
      display: flex; gap: 12px; margin-bottom: 20px;
      align-items: center;
    }

    .filter-select {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      font-family: inherit;
    }

    .filter-select:hover {
      border-color: var(--primary);
    }

    .filter-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
    }

    .incidents-panel {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 20px 24px 0;
      font-size: 16px; font-weight: 800; color: var(--text-dark);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 14px 20px 10px;
      font-size: 12px; font-weight: 700;
      color: var(--text-muted);
      text-align: left; text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid #f0f0f5;
    }

    tbody tr { transition: background .15s; cursor: pointer; }
    tbody tr:hover { background: #f8f8fd; }

    tbody td {
      padding: 13px 20px;
      font-size: 13.5px; font-weight: 600; color: var(--text-dark);
      border-bottom: 1px solid #f7f7fb;
    }

    tbody tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }

    .badge-high   { background: #fdecea; color: #e05b5b; }
    .badge-medium { background: #fff3e0; color: #e0945b; }
    .badge-low    { background: #e8f8f1; color: #40c07a; }

    .action-btn {
      background: #ede9ff;
      color: #6c63ff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }

    .action-btn:hover {
      background: #ddd4ff;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .table-wrapper {
      flex: 1;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="../assets/images/logo.png" 
         style="width:36px;height:36px;object-fit:contain;border-radius:8px;" 
         alt="Logo" 
         onerror="this.style.display='none'">
    <span style="font-size:15px;font-weight:700;color:#1a1a2e;line-height:1.2;">SmartIncident</span>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
    </a>
    <a class="nav-item" href="report.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Lapor Insiden
    </a>
    <a class="nav-item active" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Riwayat Laporan
    </a>
    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Profil
    </a>
  </nav>

  <div class="sidebar-bottom">
    <button class="logout-btn" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Keluar
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">Riwayat Laporan</div>
      <div class="topbar-subtitle">Semua laporan insiden Anda</div>
    </div>
    <div class="topbar-right">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Cari judul atau kategori..." style="flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; color: var(--text-dark);" />
      </div>
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">...</span>
        <span class="chevron">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- Filter Bar -->
    <div class="filter-bar">
      <select id="filterStatus" class="filter-select">
        <option value="">Semua Status</option>
        <option value="open">Open</option>
        <option value="progress">On Progress</option>
        <option value="closed">Closed</option>
      </select>
      <select id="filterPriority" class="filter-select">
        <option value="">Semua Prioritas</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>

    <!-- Incidents Table -->
    <div class="incidents-panel">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>ID</th>
              <th>Judul</th>
              <th>Kategori</th>
              <th>Prioritas</th>
              <th>Status</th>
              <th>Tanggal Laporan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="8" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
const API_BASE = "http://localhost:3000/api";

// Store all incidents for filtering
let allIncidents = [];

/**
 * Initialize page on load
 */
document.addEventListener("DOMContentLoaded", function () {
  const token = getToken();
  if (!token) {
    redirectToLogin();
    return;
  }

  loadUserInfo(token);
  loadIncidents(token);
  setupEventListeners();
});

/**
 * Get JWT token from localStorage
 */
function getToken() {
  return localStorage.getItem("token") || null;
}

/**
 * Redirect to login page
 */
function redirectToLogin() {
  window.location.href = "../auth/login.html";
}

/**
 * Load user info from localStorage
 */
function loadUserInfo(token) {
  const user = JSON.parse(localStorage.getItem("user")) || {};

  const avatarEl = document.getElementById("userAvatar");
  if (avatarEl && user.name) {
    avatarEl.textContent = user.name.charAt(0).toUpperCase();
  }

  const userNameEl = document.getElementById("userName");
  if (userNameEl && user.name) {
    userNameEl.textContent = user.name;
  }
}

/**
 * Load incidents from API
 */
async function loadIncidents(token) {
  try {
    const response = await fetch(`${API_BASE}/incidents`, {
      method: "GET",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      }
    });

    if (response.status === 401) {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      redirectToLogin();
      return;
    }

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data.success && data.incidents) {
      allIncidents = data.incidents;
      renderTable(allIncidents);
    } else {
      showEmpty();
    }
  } catch (error) {
    console.error("Error loading incidents:", error);
    showEmpty();
  }
}

/**
 * Setup event listeners for filters and search
 */
function setupEventListeners() {
  document.getElementById("filterStatus").addEventListener("change", applyFilters);
  document.getElementById("filterPriority").addEventListener("change", applyFilters);
  document.getElementById("searchInput").addEventListener("input", applyFilters);

  const logoutBtn = document.querySelector(".logout-btn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", logout);
  }
}

/**
 * Apply all filters and search
 */
function applyFilters() {
  const statusValue = document.getElementById("filterStatus").value;
  const priorityValue = document.getElementById("filterPriority").value;
  const searchValue = document.getElementById("searchInput").value.toLowerCase();

  let filtered = allIncidents;

  // Filter by status
  if (statusValue) {
    filtered = filtered.filter(inc => inc.status?.toLowerCase() === statusValue);
  }

  // Filter by priority
  if (priorityValue) {
    filtered = filtered.filter(inc => inc.priority?.toLowerCase() === priorityValue);
  }

  // Filter by search (title or category)
  if (searchValue) {
    filtered = filtered.filter(inc => {
      const title = (inc.title || "").toLowerCase();
      const category = (inc.category || inc.type || "").toLowerCase();
      return title.includes(searchValue) || category.includes(searchValue);
    });
  }

  // Sort by created_at descending
  filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  renderTable(filtered);
}

/**
 * Render incidents table
 */
function renderTable(incidents) {
  const tbody = document.getElementById("historyTableBody");
  if (!tbody) return;

  if (incidents.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Belum ada laporan insiden.</td></tr>';
    return;
  }

  tbody.innerHTML = "";
  incidents.forEach((inc, index) => {
    const row = document.createElement("tr");

    const category = inc.type || inc.category || "N/A";
    const statusBadge = getStatusBadge(inc.status);
    const priorityBadge = getPriorityBadge(inc.priority);
    const formattedDate = formatDate(inc.created_at);

    row.innerHTML = `
      <td>${index + 1}</td>
      <td>#INC-${String(inc.id).padStart(4, "0")}</td>
      <td>${escapeHtml(inc.title)}</td>
      <td>${escapeHtml(category)}</td>
      <td>${priorityBadge}</td>
      <td>${statusBadge}</td>
      <td>${formattedDate}</td>
      <td>
        <button onclick="window.location.href='incident-detail.html?id=${encodeURIComponent(inc.id)}'" style="background:#ede9ff;color:#6c63ff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">
          Detail
        </button>
      </td>
    `;

    tbody.appendChild(row);
  });
}

/**
 * Get status badge HTML
 */
function getStatusBadge(status) {
  const map = {
    open:     { label: 'Open',        bg: '#e3f2fd', color: '#1976d2' },
    progress: { label: 'On Progress', bg: '#fff3e0', color: '#f57c00' },
    closed:   { label: 'Closed',      bg: '#f1f8e9', color: '#689f38' }
  };
  const s = map[status?.toLowerCase()] || { label: status, bg: '#f0f0f0', color: '#666' };
  return `<span style="background:${s.bg};color:${s.color};padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">${s.label}</span>`;
}

/**
 * Get priority badge HTML
 */
function getPriorityBadge(priority) {
  if (priority?.toLowerCase() === 'high') return '<span class="badge badge-high">High</span>';
  if (priority?.toLowerCase() === 'medium') return '<span class="badge badge-medium">Medium</span>';
  return '<span class="badge badge-low">Low</span>';
}

/**
 * Format date to readable format
 */
function formatDate(dateString) {
  if (!dateString) return "N/A";
  try {
    const date = new Date(dateString);
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const day = date.getDate();
    const month = months[date.getMonth()];
    const year = date.getFullYear();
    return `${month} ${day}, ${year}`;
  } catch (e) {
    return dateString;
  }
}

/**
 * Escape HTML special characters
 */
function escapeHtml(text) {
  if (!text) return "";
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

/**
 * Show empty state
 */
function showEmpty() {
  const tbody = document.getElementById("historyTableBody");
  if (tbody) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Belum ada laporan insiden.</td></tr>';
  }
}

/**
 * Logout handler
 */
function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  redirectToLogin();
}
</script>

</body>
</html>
