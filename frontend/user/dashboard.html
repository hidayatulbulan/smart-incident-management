<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMART Incident - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg: #ffffff;
      --sidebar-width: 220px;
      --main-bg: #f4f6fb;
      --primary: #6c63ff;
      --primary-light: #ede9ff;
      --text-dark: #1a1a2e;
      --text-muted: #8a8fa8;
      --card-red: #e05b5b;
      --card-blue: #5b8def;
      --card-orange: #e0845b;
      --card-teal: #4dc4a8;
      --shadow: 0 4px 18px rgba(108,99,255,0.08);
      --radius: 16px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--main-bg);
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 28px 0 20px;
      min-height: 100vh;
      box-shadow: 2px 0 12px rgba(108,99,255,0.06);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px 28px;
      border-bottom: 1px solid #f0f0f5;
    }

    .logo-icon {
      width: 38px; height: 38px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; }

    .logo-text { line-height: 1.15; }
    .logo-text .brand { font-size: 15px; font-weight: 800; color: var(--text-dark); letter-spacing: .5px; }
    .logo-text .sub { font-size: 10px; font-weight: 600; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }

    .sidebar-nav { flex: 1; padding: 20px 0; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 22px;
      color: var(--text-muted);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      border-radius: 0;
      transition: background .2s, color .2s;
      text-decoration: none;
      position: relative;
    }

    .nav-item:hover { color: var(--primary); background: var(--primary-light); }
    .nav-item.active { color: var(--primary); background: var(--primary-light); }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-bottom {
      padding: 16px 22px 0;
      border-top: 1px solid #f0f0f5;
    }

    .logout-btn {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-muted); font-size: 13px; font-weight: 600;
      cursor: pointer; background: none; border: none;
      padding: 8px 0;
      transition: color .2s;
    }
    .logout-btn:hover { color: #e05b5b; }
    .logout-btn svg { width: 17px; height: 17px; }

    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px 0;
      background: transparent;
    }

    .topbar-greeting {
      font-size: 20px; font-weight: 800; color: var(--text-dark);
      display: flex; align-items: center; gap: 8px;
    }

    .topbar-right { display: flex; align-items: center; gap: 18px; }

    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: #ffffff;
      border: 1px solid #e8e8f0;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px; color: var(--text-muted);
      min-width: 200px;
      cursor: text;
    }
    .search-bar svg { width: 15px; height: 15px; }
    .search-bar input { flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; color: var(--text-dark); background: transparent; }
    .search-bar input::placeholder { color: var(--text-muted); }

    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f6a05b, #e05b5b);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }

    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .user-name { font-size: 14px; font-weight: 700; color: var(--text-dark); }
    .chevron { color: var(--text-muted); }

    .content {
      display: flex; gap: 24px;
      padding: 24px 32px 32px;
      flex: 1;
    }

    .content-left { flex: 1; display: flex; flex-direction: column; gap: 24px; }

    .stat-cards { display: flex; gap: 16px; }

    .stat-card {
      flex: 1; border-radius: var(--radius);
      padding: 20px 22px;
      position: relative; overflow: hidden;
      min-height: 110px;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    }

    .stat-card::before, .stat-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: .25;
    }

    .stat-card.red   { background: linear-gradient(135deg, #e05b5b, #e87c7c); }
    .stat-card.blue  { background: linear-gradient(135deg, #5b8def, #7aaef5); }
    .stat-card.orange{ background: linear-gradient(135deg, #e0845b, #e8a07c); }
    .stat-card.teal  { background: linear-gradient(135deg, #4dc4a8, #70d4bc); }

    .stat-card.red::before   { background: #ff8f8f; width: 90px; height: 90px; top: -20px; right: 10px; }
    .stat-card.red::after    { background: #c94444; width: 55px; height: 55px; top: 30px; right: -10px; }
    .stat-card.blue::before  { background: #7ab2ff; width: 80px; height: 80px; top: -15px; right: 20px; }
    .stat-card.blue::after   { background: #3d72d6; width: 45px; height: 45px; bottom: -5px; right: 15px; }
    .stat-card.orange::before{ background: #f0a880; width: 85px; height: 85px; top: -18px; right: 10px; }
    .stat-card.orange::after { background: #c86a3a; width: 50px; height: 50px; bottom: -8px; right: 20px; }
    .stat-card.teal::before  { background: #70e0c8; width: 80px; height: 80px; top: -18px; right: 15px; }
    .stat-card.teal::after   { background: #30a88a; width: 50px; height: 50px; top: 30px; right: -8px; }

    .stat-label {
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85);
      text-transform: uppercase; letter-spacing: .5px;
      display: flex; align-items: center; gap: 6px;
    }
    .stat-label svg { width: 15px; height: 15px; }

    .stat-val {
      font-size: 32px; font-weight: 800; color: #fff;
      display: flex; align-items: center; gap: 8px;
      position: relative; z-index: 1;
    }
    .stat-val svg { width: 20px; height: 20px; }

    .incidents-panel {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 20px 24px 0;
      font-size: 16px; font-weight: 800; color: var(--text-dark);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 14px 20px 10px;
      font-size: 12px; font-weight: 700;
      color: var(--text-muted);
      text-align: left; text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid #f0f0f5;
    }

    tbody tr { transition: background .15s; cursor: pointer; }
    tbody tr:hover { background: #f8f8fd; }

    tbody td {
      padding: 13px 20px;
      font-size: 13.5px; font-weight: 600; color: var(--text-dark);
      border-bottom: 1px solid #f7f7fb;
    }

    tbody tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px; font-weight: 700;
    }

    .badge-high   { background: #fdecea; color: #e05b5b; }
    .badge-medium { background: #fff3e0; color: #e0945b; }
    .badge-low    { background: #e8f8f1; color: #40c07a; }

    .status-open       { color: #5b8def; font-weight: 700; }
    .status-inprogress { color: #ed8c41; font-weight: 700; }
    .status-closed     { color: #5fc343; font-weight: 700; }

    .view-all-wrap {
      display: flex; justify-content: center;
      padding: 16px;
      border-top: 1px solid #f0f0f5;
    }

    .view-all-btn {
      background: none; border: none;
      color: var(--primary); font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      padding: 6px 18px;
      border-radius: 8px;
      transition: background .2s;
    }
    .view-all-btn:hover { background: var(--primary-light); }

    .right-panel {
      width: 230px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 16px;
    }

    .progress-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .progress-title {
      font-size: 14px; font-weight: 800; color: var(--text-dark);
      margin-bottom: 16px;
    }

    .progress-steps {
      display: flex; align-items: flex-start; gap: 0;
      position: relative;
    }

    .step {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
      position: relative;
    }

    .step-line {
      position: absolute;
      top: 11px; left: 50%; right: -50%;
      height: 2px;
      background: #e8e8f0;
      z-index: 0;
    }

    .step:last-child .step-line { display: none; }

    .step-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2.5px solid #ddd;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
      transition: all .2s;
    }

    .step-dot.done   { background: #4dc4a8; border-color: #4dc4a8; }
    .step-dot.active { background: #6c63ff; border-color: #6c63ff; }
    .step-dot.idle   { background: #fff; border-color: #ddd; }
    .step-dot svg { width: 11px; height: 11px; }

    .step-label {
      font-size: 9px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .4px;
      text-align: center;
    }

    .incident-detail-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .detail-title { font-size: 15px; font-weight: 800; color: var(--text-dark); margin-bottom: 2px; }
    .detail-cat   { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }

    .detail-status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #fff3e0; color: #e0945b;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
      margin-bottom: 12px;
    }
    .detail-status-badge .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #e0945b;
    }

    .detail-assigned {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-muted); font-weight: 600;
    }
    .detail-assigned svg { width: 14px; height: 14px; }

    .detail-updated {
      margin-top: 12px;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-muted); font-weight: 600;
    }
    .detail-updated svg { width: 12px; height: 12px; }

    .report-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--primary);
      color: #fff; font-size: 13px; font-weight: 700;
      border: none; border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 6px 18px rgba(108,99,255,.30);
      transition: transform .15s, box-shadow .15s;
      width: 100%;
    }
    .report-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(108,99,255,.38); }
    .report-btn svg { width: 16px; height: 16px; }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="../assets/images/logo.png" 
         style="width:36px;height:36px;object-fit:contain;border-radius:8px;"

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-greeting" id="greeting">Hi, ... 👋</div>
    <div class="topbar-right">
      <div class="search-bar" style="padding: 0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>

      <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">...</span>

  </div>

  <div class="content">
    <div class="content-left">

      <!-- Stat Cards -->
      <div class="stat-cards">
        <div class="stat-card red">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Total Reports
          </div>
          <div class="stat-val">
            <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span id="totalReports">0</span>
          </div>
        </div>
        <div class="stat-card blue">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Open Incidents
          </div>
          <div class="stat-val">
            <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

        <div class="stat-card orange">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            On Progress
          </div>
          <div class="stat-val">
            <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span id="inProgressIncidents">0</span>
          </div>
        </div>
        <div class="stat-card teal">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
            Closed
          </div>
          <div class="stat-val">
            <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span id="closedIncidents">0</span>
          </div>
        </div>
      </div>

      <!-- Incidents Table -->
      <div class="incidents-panel">
        <div class="panel-header">My Recent Incidents</div>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Reported</th>

          </thead>
          <tbody id="incidentsTableBody">
            <tr><td colspan="5" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
        <div class="view-all-wrap">
          <button class="view-all-btn" onclick="window.location.href='history.html'">View All</button>
        </div>

    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="progress-card">
        <div class="progress-title">Incident Progress</div>
        <div class="progress-steps" id="progressSteps">

            <div class="step-line"></div>
            <div class="step-dot done">

        <div class="detail-cat" id="latestCategory">-</div>

          <span class="dot"></span>
          <span id="latestStatus">-</span>

        <div class="detail-assigned">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="latestAssigned">-</span>
        </div>
        <div class="detail-updated">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="latestUpdated">-</span>
        </div>
      </div>

      <button class="report-btn" onclick="window.location.href='report.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Report New Incident
      </button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:3000/api';

/**
 * XSS Prevention: Escape HTML special characters
 */
function escapeHtml(text) {
  if (!text) return '';
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

/**
 * Capitalize first letter of string
 */
function capitalizeFirst(str) {
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1);
}

/**
 * Status badge styling map
 */
const statusMap = {
  open:     { label: 'Open',        bg: '#e3f2fd', color: '#1976d2' },
  progress: { label: 'On Progress', bg: '#fff3e0', color: '#f57c00' },
  closed:   { label: 'Closed',      bg: '#f1f8e9', color: '#689f38' }
};

/**
 * Get styled HTML badge for status
 * @param {string} status Status value
 * @returns {string} HTML span with styling
 */
function getStatusBadge(status) {
  const map = {
    open:     { label: 'Open',        bg: '#e3f2fd', color: '#1976d2' },
    progress: { label: 'On Progress', bg: '#fff3e0', color: '#f57c00' },
    closed:   { label: 'Closed',      bg: '#f1f8e9', color: '#689f38' }
  };
  const s = map[status?.toLowerCase()] || { label: status, bg: '#f0f0f0', color: '#666' };
  return `<span style="background:${s.bg};color:${s.color};padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">${s.label}</span>`;
}

function getToken() {
  return localStorage.getItem('token');
}

function redirectToLogin() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '../auth/login.html';
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '../auth/login.html';
}

async function goToLatestIncident() {
  try {
    const token = getToken();
    if (!token) { window.location.href = '../auth/login.html'; return; }
    const response = await fetch(`${API_BASE}/incidents`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await response.json();
    if (data.incidents && data.incidents.length > 0) {
      window.location.href = `incident-detail.html?id=${data.incidents[0].id}`;
    } else {
      alert('Belum ada laporan insiden.');
    }
  } catch (err) {
    alert('Gagal memuat laporan.');
  }
}

function formatDate(dateString) {
  if (!dateString) return '-';
  const date = new Date(dateString);
  return date.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
}

function formatStatus(status) {
  const map = { open: 'Open', progress: 'On Progress', closed: 'Closed' };
  return map[status?.toLowerCase()] || status;
}

function getPriorityBadge(priority) {
  const p = priority?.toLowerCase();
  if (p === 'high') return '<span class="badge badge-high">High</span>';
  if (p === 'medium') return '<span class="badge badge-medium">Medium</span>';
  return '<span class="badge badge-low">Low</span>';
}

function getStatusClass(status) {
  const s = status?.toLowerCase();
  if (s === 'open') return 'status-open';
  if (s === 'progress') return 'status-progress';
  return 'status-closed';
}

function updateProgressIndicator(incidents) {
  if (!incidents || incidents.length === 0) return;
  const latest = incidents[0];
  const status = latest.status?.toLowerCase() || 'open';
  const progressSteps = document.querySelectorAll('#progressSteps .step');
  
  if (progressSteps.length >= 3) {
    const reportedDot = progressSteps[0].querySelector('.step-dot');
    const inProgressDot = progressSteps[1].querySelector('.step-dot');
    const closedDot = progressSteps[2].querySelector('.step-dot');
    
    // Reset all dots
    [reportedDot, inProgressDot, closedDot].forEach(d => {
      d.classList.remove('done', 'active', 'idle');
    });
    
    if (status === 'open') {
      reportedDot.classList.add('active');
      inProgressDot.classList.add('idle');
      closedDot.classList.add('idle');
    } else if (status === 'progress') {
      reportedDot.classList.add('done');
      inProgressDot.classList.add('active');
      closedDot.classList.add('idle');
    } else if (status === 'closed') {
      reportedDot.classList.add('done');
      inProgressDot.classList.add('done');
      closedDot.classList.add('done');
    }
  }
}

function filterIncidentsTable(searchTerm) {
  const rows = document.querySelectorAll('#incidentsTableBody tr');
  rows.forEach(row => {
    const emptyState = row.querySelector('.empty-state');
    if (emptyState) return;
    const titleCell = row.cells[0]?.textContent.toLowerCase() || '';
    const categoryCell = row.cells[1]?.textContent.toLowerCase() || '';
    const matches = titleCell.includes(searchTerm) || categoryCell.includes(searchTerm);
    row.style.display = matches ? '' : 'none';
  });
}

async function loadDashboard() {
  const token = getToken();
  if (!token) {
    redirectToLogin();
    return;
  }

  // Set user info
  const user = JSON.parse(localStorage.getItem('user')) || {};
  if (user.name) {
    document.getElementById('greeting').innerHTML = `Hi, ${escapeHtml(user.name)} 👋`;
    document.getElementById('userName').textContent = escapeHtml(user.name);
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
  }

  try {
    const response = await fetch(`${API_BASE}/incidents`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (response.status === 401) {
      redirectToLogin();
      return;
    }

    const data = await response.json();
    const incidents = data.incidents || [];

    // Stats
    const total = incidents.length;
    const open = incidents.filter(i => i.status?.toLowerCase() === 'open').length;
    const inProgress = incidents.filter(i => ['in_progress','inprogress'].includes(i.status?.toLowerCase())).length;
    const closed = incidents.filter(i => i.status?.toLowerCase() === 'closed').length;

    document.getElementById('totalReports').textContent = total;
    document.getElementById('openIncidents').textContent = open;
    document.getElementById('inProgressIncidents').textContent = inProgress;
    document.getElementById('closedIncidents').textContent = closed;

    // Table
    const tbody = document.getElementById('incidentsTableBody');
    if (incidents.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada laporan insiden.</td></tr>';
    } else {
      tbody.innerHTML = incidents.slice(0, 5).map(inc => `
        <tr onclick="window.location.href='incident-detail.html?id=${inc.id}'">
          <td>${escapeHtml(inc.title) || '-'}</td>
          <td>${escapeHtml(inc.category || inc.type) || '-'}</td>
          <td>${getPriorityBadge(inc.priority)}</td>
          <td>${getStatusBadge(inc.status)}</td>
          <td>${formatDate(inc.created_at)}</td>
        </tr>
      `).join('');
    }

    // Latest incident card
    if (incidents.length > 0) {
      const latest = incidents[0];
      document.getElementById('latestTitle').textContent = escapeHtml(latest.title) || '-';
      document.getElementById('latestCategory').textContent = escapeHtml(latest.category || latest.type) || '-';
      
      document.getElementById('latestStatus').innerHTML = getStatusBadge(latest.status);
      
      document.getElementById('latestAssigned').textContent =
        latest.status === 'progress' ? 'Sedang ditangani oleh tim teknisi' : 'Menunggu penanganan';
      document.getElementById('latestUpdated').textContent = `Updated ${formatDate(latest.updated_at)}`;
    }

    // Setup search bar
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        filterIncidentsTable(this.value.toLowerCase());
      });
    }

    // Update progress indicator
    updateProgressIndicator(incidents);

  } catch (err) {
    console.error('Error loading dashboard:', err);
    alert('Gagal memuat dashboard');
  }
}

loadDashboard();
</script>
